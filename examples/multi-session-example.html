<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Session Chat Example - Generic LLM Worker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-4">Multi-Session Chat Example</h1>
            <p class="text-gray-600 mb-6">Simplified example showing session management with the generic worker.</p>
            
            
            <!-- Session Selector -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Choose Session:</label>
                <select id="session-selector" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="coding-assistant">💻 Coding Assistant</option>
                    <option value="creative-writer">✍️ Creative Writer</option>
                    <option value="science-tutor">🔬 Science Tutor</option>
                    <option value="fitness-coach">💪 Fitness Coach</option>
                </select>
            </div>

            <!-- Loading Status -->
            <div id="loading" class="mb-4 bg-gray-50 p-4 rounded-lg">
                <div id="loading-text" class="text-blue-600 font-semibold text-center mb-2">Click Load Model to start...</div>
                <div class="space-y-2 hidden" id="progress-container">
                    <div class="flex justify-between items-center text-sm">
                        <span id="bytes-loaded" class="font-mono text-gray-600">0 MB loaded</span>
                        <span id="model-percent" class="font-semibold">0%</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded overflow-hidden">
                        <div id="model-progress" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Load Model Button -->
            <div class="text-center mb-4" id="load-section">
                <button id="load-model" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 font-semibold">
                    Load Model
                </button>
            </div>

            <!-- Chat Interface -->
            <div id="chat-container" class="hidden">
                <!-- Current session info -->
                <div id="session-info" class="bg-blue-50 p-3 rounded-lg mb-4">
                    <h3 class="font-semibold">Session: <span id="current-session-name">Coding Assistant</span></h3>
                    <p class="text-sm text-gray-600" id="current-session-description">A senior software engineer</p>
                    <button id="clear-session" class="text-xs text-red-600 hover:underline mt-1">Clear Session</button>
                </div>

                <!-- Chat messages -->
                <div id="chat-messages" class="h-96 overflow-y-auto space-y-4 mb-4 p-4 bg-gray-50 rounded-lg">
                    <!-- Messages will be added here -->
                </div>

                <!-- Input form -->
                <form id="chat-form" class="flex space-x-2">
                    <input type="text" id="user-input"
                        class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Type your message..." disabled>
                    <button type="submit" id="send-button"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 disabled:bg-gray-400" disabled>
                        Send
                    </button>
                    <button type="button" id="stop-button"
                        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 hidden">
                        Stop
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        // Initialize the generic worker
        const worker = new Worker('../generic-llm-worker.js', { type: 'module' });

        // Session configurations
        const SESSIONS = {
            'coding-assistant': {
                name: 'Coding Assistant',
                description: 'A senior software engineer who helps with programming',
                systemMessage: 'You are a senior software engineer. Provide clear, practical coding advice.'
            },
            'creative-writer': {
                name: 'Creative Writer', 
                description: 'A creative storyteller and writing coach',
                systemMessage: 'You are a creative writer. Help with creative writing and storytelling.'
            },
            'science-tutor': {
                name: 'Science Tutor',
                description: 'A patient science teacher',
                systemMessage: 'You are a science teacher. Explain concepts clearly with examples.'
            },
            'fitness-coach': {
                name: 'Fitness Coach',
                description: 'A motivational fitness expert',
                systemMessage: 'You are a fitness trainer. Provide practical fitness and health advice.'
            }
        };

        // UI Elements
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const progressContainer = document.getElementById('progress-container');
        const modelProgress = document.getElementById('model-progress');
        const modelPercent = document.getElementById('model-percent');
        const bytesLoaded = document.getElementById('bytes-loaded');
        const loadSection = document.getElementById('load-section');
        const loadModelButton = document.getElementById('load-model');
        
        const sessionSelector = document.getElementById('session-selector');
        const chatContainer = document.getElementById('chat-container');
        const currentSessionName = document.getElementById('current-session-name');
        const currentSessionDescription = document.getElementById('current-session-description');
        const clearSessionButton = document.getElementById('clear-session');
        
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const stopButton = document.getElementById('stop-button');

        let currentSessionId = 'coding-assistant';
        let isGenerating = false;
        let isModelLoaded = false;

        // Update session info display
        function updateSessionInfo() {
            const session = SESSIONS[currentSessionId];
            currentSessionName.textContent = session.name;
            currentSessionDescription.textContent = session.description;
        }

        // Add message to chat
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-[70%] p-3 rounded-lg ${isUser ? 'bg-blue-500 text-white' : 'bg-white shadow-sm'}`;
            messageBubble.style.whiteSpace = 'pre-wrap';
            messageBubble.textContent = content;

            messageDiv.appendChild(messageBubble);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 100);
            
            return messageBubble;
        }

        // Initialize model
        function initializeModel() {
            loadSection.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            loadingText.textContent = 'Initializing...';
            
            worker.postMessage({
                type: 'initialize',
                data: {
                    model: 'smollm2-1.7b',
                    temperature: 0.7,
                    max_new_tokens: 512
                }
            });
        }

        // Event Listeners
        loadModelButton.addEventListener('click', initializeModel);

        sessionSelector.addEventListener('change', (e) => {
            if (isGenerating) return;
            currentSessionId = e.target.value;
            updateSessionInfo();
            chatMessages.innerHTML = ''; // Clear display for new session
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!isModelLoaded || isGenerating) return;
            
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);

            // Clear input and update UI
            userInput.value = '';
            stopButton.classList.remove('hidden');
            sendButton.disabled = true;
            userInput.disabled = true;
            isGenerating = true;

            // Send to worker
            const sessionConfig = SESSIONS[currentSessionId];
            worker.postMessage({
                type: 'generateChat',
                data: {
                    message: message,
                    sessionId: currentSessionId,
                    systemMessage: {
                        role: "system",
                        content: sessionConfig.systemMessage
                    }
                }
            });
        });

        stopButton.addEventListener('click', () => {
            worker.postMessage({ type: 'interrupt' });
        });

        clearSessionButton.addEventListener('click', () => {
            if (confirm(`Clear session: ${SESSIONS[currentSessionId].name}?`)) {
                worker.postMessage({
                    type: 'clearSession',
                    data: { sessionId: currentSessionId }
                });
                chatMessages.innerHTML = '';
            }
        });

        // Handle worker messages
        let currentMessageBubble = null;

        worker.addEventListener('message', (e) => {
            const { type, status, data } = e.data;

            switch (type) {
                case 'initialize':
                    handleInitializeResponse(status, data);
                    break;
                    
                case 'generateChat':
                    handleChatResponse(status, data);
                    break;
                    
                case 'interrupt':
                    if (currentMessageBubble) {
                        currentMessageBubble.textContent += ' [Interrupted]';
                    }
                    resetGenerationState();
                    break;
            }
        });

        function handleInitializeResponse(status, data) {
            switch (status) {
                case 'loading':
                    loadingText.textContent = data.message;
                    break;
                    
                case 'progress':
                    const { loaded, percentage, modelName } = data;
                    if (percentage !== undefined) {
                        modelProgress.style.width = `${percentage}%`;
                        modelPercent.textContent = `${percentage}%`;
                    }
                    if (loaded !== undefined) {
                        const loadedMB = (loaded / (1024 * 1024)).toFixed(1);
                        bytesLoaded.textContent = `${loadedMB} MB loaded`;
                    }
                    if (modelName) {
                        loadingText.textContent = `Loading ${modelName}...`;
                    }
                    break;
                    
                case 'ready':
                    loadingText.textContent = 'Model ready!';
                    setTimeout(() => {
                        loadingDiv.classList.add('hidden');
                        chatContainer.classList.remove('hidden');
                        userInput.disabled = false;
                        sendButton.disabled = false;
                        isModelLoaded = true;
                        updateSessionInfo();
                    }, 1000);
                    break;
                    
                case 'error':
                    loadingText.textContent = 'Error: ' + data.error;
                    alert('Failed to load model: ' + data.error);
                    break;
            }
        }

        function handleChatResponse(status, data) {
            switch (status) {
                case 'start':
                    currentMessageBubble = addMessage('', false);
                    break;
                    
                case 'streaming':
                    if (currentMessageBubble && data.fullText !== undefined) {
                        currentMessageBubble.textContent = data.fullText;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                    break;
                    
                case 'complete':
                    if (currentMessageBubble) {
                        currentMessageBubble.textContent = data.text;
                    }
                    resetGenerationState();
                    break;
                    
                case 'error':
                    if (currentMessageBubble) {
                        currentMessageBubble.textContent = 'Error: ' + data.error;
                        currentMessageBubble.className = currentMessageBubble.className.replace('bg-white', 'bg-red-100');
                    }
                    resetGenerationState();
                    break;
            }
        }

        function resetGenerationState() {
            stopButton.classList.add('hidden');
            sendButton.disabled = false;
            userInput.disabled = false;
            isGenerating = false;
        }

        // Initialize session info on load
        updateSessionInfo();
    </script>
</body>
</html>
